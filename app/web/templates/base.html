<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <title>PyCoach Web - Learn Python Interactively</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  </head>
  <body>
    <nav class="nav">
      <div class="nav-links">
        <a href="{{ url_for('home.index') }}">Home</a>
        <a href="{{ url_for('learn.list_lessons') }}">Learn</a>
        <a href="{{ url_for('learn.docs_index') }}">Docs</a>
        <a href="{{ url_for('practice.practice') }}">Practice</a>
        <a href="{{ url_for('flashcards.review') }}">Flashcards</a>
        <a href="{{ url_for('coach.coach') }}">Coach</a>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()">
        <span id="theme-icon">🌙 Dark</span>
      </button>
    </nav>
      
    <main class="container">
      {% block content %}{% endblock %}
    </main>
    <script>
      function toggleTheme() {
        const html = document.documentElement;
        const currentTheme = html.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        html.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        document.getElementById('theme-icon').textContent = newTheme === 'light' ? '🌙 Dark' : '☀️ Light';
      }
      
      // Load saved theme
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      document.getElementById('theme-icon').textContent = savedTheme === 'light' ? '🌙 Dark' : '☀️ Light';
    </script>
  </body>
</html>
