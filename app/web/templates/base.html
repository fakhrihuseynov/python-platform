<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <title>PyCoach Web - Learn Python Interactively</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  </head>
  <body>
    <nav class="nav">
      <div class="nav-links">
        <a href="{{ url_for('home.index') }}">Home</a>
        <a href="{{ url_for('learn.list_lessons') }}">Learn</a>
        <a href="{{ url_for('practice.practice') }}">Practice</a>
        <a href="{{ url_for('learn.docs_index') }}">Docs</a>
        <a href="{{ url_for('flashcards.review') }}">Flashcards</a>
        <a href="{{ url_for('coach.coach') }}">Coach</a>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()">
        <span id="theme-icon">🌙 Dark</span>
      </button>
    </nav>
      
    <main class="container">
      {% block content %}{% endblock %}
    </main>
    {% include 'scripts/base_theme.html' %}
  </body>
</html>
