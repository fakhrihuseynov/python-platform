{% extends "base.html" %}
{% block content %}
<h2>AI Coach</h2>
<p class="text-secondary" style="margin-bottom: 2rem;">Ask questions and get help from Ollama (Mistral)</p>

<form method="post" id="coachForm">
  <label for="prompt">Your Question:</label>
  <textarea name="prompt" id="prompt" rows="5" placeholder="Ask me anything about Python...

Example: How do I create a list in Python?">{{ prompt }}</textarea>
  <button type="submit" id="askBtn">Ask Coach</button>
</form>

{% if reply %}
<div style="margin-top: 2rem;">
  <h3>Coach's Reply:</h3>
  {% if 'Could not connect' in reply or 'Error' in reply %}
    <div class="error">{{ reply }}</div>
  {% else %}
    <div class="card markdown-content">
      {{ reply_html|safe }}
    </div>
  {% endif %}
</div>
{% endif %}

<script>
document.getElementById('coachForm').addEventListener('submit', function(e) {
  const btn = document.getElementById('askBtn');
  btn.textContent = 'Answering...';
  btn.classList.add('loading');
  btn.disabled = true;
});
</script>
{% endblock %}
