{% extends "base.html" %}
{% block content %}
<h2>AI Coach</h2>
<p class="text-secondary" style="margin-bottom: 2rem;">Ask questions and get help from Ollama (Mistral)</p>

<form method="post" id="coachForm">
  <label for="prompt">Your Question:</label>
  <textarea name="prompt" id="prompt" rows="5" placeholder="Ask me anything about Python...

Example: How do I create a list in Python?">{{ prompt }}</textarea>
  <button type="submit" id="askBtn">Ask Coach</button>
</form>

{% if reply %}
<div style="margin-top: 2rem;">
  <h3>Coach's Reply:</h3>
  {% if 'Could not connect' in reply or 'Error' in reply %}
    <div class="error">{{ reply }}</div>
  {% else %}
    <div class="card markdown-content">
      {{ reply_html|safe }}
    </div>
  {% endif %}
</div>
{% endif %}

<script>
document.getElementById('coachForm').addEventListener('submit', function(e) {
  const btn = document.getElementById('askBtn');
  btn.textContent = 'Answering...';
  btn.classList.add('loading');
  btn.disabled = true;
});

// Auto-pairing for the coach question editor (same behavior as Practice editor)
(function() {
  const editor = document.getElementById('prompt');
  if (!editor) return;
  const pairs = {
    '(': ')',
    '[': ']',
    '{': '}',
    '"': '"',
    "'": "'"
  };

  editor.addEventListener('keydown', function(e) {
    const val = editor.value;
    const start = editor.selectionStart;
    const end = editor.selectionEnd;

    if (pairs.hasOwnProperty(e.key)) {
      e.preventDefault();
      const close = pairs[e.key];
      if (start !== end) {
        const before = val.slice(0, start);
        const selected = val.slice(start, end);
        const after = val.slice(end);
        editor.value = before + e.key + selected + close + after;
        editor.selectionStart = start + 1;
        editor.selectionEnd = end + 1;
      } else {
        const before = val.slice(0, start);
        const after = val.slice(start);
        editor.value = before + e.key + close + after;
        editor.selectionStart = editor.selectionEnd = start + 1;
      }
      return;
    }

    const closers = Object.values(pairs);
    if (closers.includes(e.key)) {
      if (start === end && val[start] === e.key) {
        e.preventDefault();
        editor.selectionStart = editor.selectionEnd = start + 1;
        return;
      }
    }

    if (e.key === 'Backspace') {
      if (start === end && start > 0) {
        const prev = val[start - 1];
        const next = val[start];
        if (pairs[prev] && pairs[prev] === next) {
          e.preventDefault();
          const before = val.slice(0, start - 1);
          const after = val.slice(start + 1);
          editor.value = before + after;
          editor.selectionStart = editor.selectionEnd = start - 1;
          return;
        }
      }
    }
  });
})();
</script>
{% endblock %}
