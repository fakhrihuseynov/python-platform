{% extends "base.html" %}
{% block content %}
<div style="display:flex; gap:1.5rem;">
  <aside style="position:fixed; left:0; top:80px; bottom:0; width:30vw; min-width:240px; overflow:auto; padding:1.5rem; box-sizing:border-box;">
    <div class="card">
      <div style="display:flex; gap:0.5rem; align-items:center; margin-bottom:0.75rem;">
        <h3 class="futuristic-title" style="margin:0; font-size:1rem; flex:1">Docs</h3>
        <input id="newFolderName" placeholder="New folder name" style="padding:0.35rem 0.5rem; border:1px solid var(--border); width:160px;">
        <button id="createFolderBtn" class="btn" title="Add folder">＋</button>
      </div>
      <div id="foldersList" style="display:flex; flex-direction:column; gap:0.5rem; max-height:70vh; overflow:auto;"></div>
    </div>
  </aside>

  <section id="docsEditorSection" style="flex:1; padding:1.5rem; box-sizing:border-box; position:fixed; left:30vw; top:95px; right:0; bottom:0; overflow:auto;">
    <div class="card" style="position:relative; margin:0;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:1rem; position:relative;">
        <h3 style="margin-top:0; margin-bottom:0.5rem; flex:1">Editor</h3>
        <div style="display:flex; gap:0.5rem; align-items:center;">
          <!-- toolbar inline with Save. Also create a fixed-left toolbar so it's ~20-30% from left edge -->
          <div id="editorToolbar" style="display:flex; gap:8px; align-items:center; position:relative; left:auto; top:auto; z-index:auto; margin-right:10rem;">
            <button class="btn" title="Bold" id="fmtBold" style="width:34px; height:30px; padding:0; display:inline-flex; align-items:center; justify-content:center;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h7a3 3 0 0 1 0 6H6z"></path><path d="M6 10h8a3 3 0 0 1 0 6H6z"></path></svg>
            </button>
            <button class="btn" title="Italic" id="fmtItalic" style="width:34px; height:30px; padding:0; display:inline-flex; align-items:center; justify-content:center;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="4" x2="10" y2="4"></line><line x1="14" y1="20" x2="5" y2="20"></line><line x1="15" y1="4" x2="9" y2="20"></line></svg>
            </button>
            <select id="fmtFontFamily" title="Font family" style="height:30px; padding:0 6px; font-size:12px; border:1px solid var(--border); background:var(--bg-primary); color:var(--text-primary); border-radius:4px; display:inline-flex; align-items:center; vertical-align:middle; margin-top: 5%;">
              <option value="" selected>Font</option>
              <option value="Udemy Sans">Udemy Sans</option>
              <option value="Noto Sans JP">Noto Sans JP</option>
              <option value="Vazirmatn">Vazirmatn</option>
              <option value="SF Pro Text">SF Pro Text</option>
            </select>
            <select id="fmtFontSize" title="Font size" style="height:30px; padding:0 6px; font-size:12px; border:1px solid var(--border); background:var(--bg-primary); color:var(--text-primary); border-radius:4px; display:inline-flex; align-items:center; vertical-align:middle; margin-top: 5%;">
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
              <option value="11">11</option>
              <option value="12">12</option>
              <option value="13">13</option>
              <option value="14" selected>14</option>
              <option value="15">15</option>
              <option value="16">16</option>
              <option value="18">18</option>
              <option value="20">20</option>
              <option value="22">22</option>
              <option value="24">24</option>
              <option value="28">28</option>
              <option value="32">32</option>
              <option value="36">36</option>
            </select>
            <button class="btn" id="fmtLink" title="Insert link" style="width:34px; height:30px; padding:0; display:inline-flex; align-items:center; justify-content:center;">
              <!-- link icon -->
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
            </button>
            <div style="position:relative;">
              <button class="btn" id="fmtHighlight" title="Highlight" style="width:34px; height:30px; padding:0; display:inline-flex; align-items:center; justify-content:center;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="12" width="20" height="8" rx="2"></rect><path d="M12 12V8"></path></svg>
              </button>
              <!-- highlight popover placeholder -->
              <div id="highlightPopover" style="display:none; position:absolute; top:36px; left:0; background:var(--bg-primary); border:1px solid var(--border); padding:6px; gap:6px; z-index:50; flex-direction:row;">
                <button class="color-swatch" data-color="none" title="Remove highlight" style="width:22px; height:22px; border-radius:4px; border:1px solid #ddd; background:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:bold; color:#999;">×</button>
                <button class="color-swatch" data-color="#fff475" style="width:22px; height:22px; border-radius:4px; border:1px solid #ddd; background:#fff475"></button>
                <button class="color-swatch" data-color="#ff8a80" style="width:22px; height:22px; border-radius:4px; border:1px solid #ddd; background:#ff8a80"></button>
                <button class="color-swatch" data-color="#a7c7ff" style="width:22px; height:22px; border-radius:4px; border:1px solid #ddd; background:#a7c7ff"></button>
                <button class="color-swatch" data-color="#b9f6ca" style="width:22px; height:22px; border-radius:4px; border:1px solid #ddd; background:#b9f6ca"></button>
              </div>
            </div>
            <button class="btn" id="fmtColor" title="Font color" style="width:34px; height:30px; padding:0; display:inline-flex; align-items:center; justify-content:center;">
              <span id="colorDot" style="display:inline-block; width:12px; height:12px; border-radius:50%; background:#000; border:1px solid #ccc;"></span>
            </button>
            <input type="color" id="colorPicker" style="display:none;" />
          </div>
          <div style="display:flex; gap:0.5rem; align-items:center;">
            <button id="undoBtn" class="btn" title="Undo" style="width:34px; height:30px; padding:0; display:inline-flex; align-items:center; justify-content:center;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"></path></svg>
            </button>
            <button id="redoBtn" class="btn" title="Redo" style="width:34px; height:30px; padding:0; display:inline-flex; align-items:center; justify-content:center;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"></path><path d="M3 17a9 9 0 019-9 9 9 0 016 2.3l3 2.7"></path></svg>
            </button>
            <button id="saveDocBtn" class="btn">Save</button>
            <button id="previewBtn" class="btn btn-secondary">Preview</button>
          </div>
        </div>
      </div>
      <input id="docTitle" placeholder="Document title" style="width:100%; padding:0.5rem; margin:0.5rem 0 0.75rem 0; border:1px solid var(--border);">
      <div id="docContent" contenteditable="true" style="width:100%; min-height:20vh; max-height:60vh; padding:1rem; border:1px solid var(--border); overflow:auto; font-family:inherit; white-space:pre-wrap; font-size:14px;"></div>
      <div id="previewArea" style="display:none; margin-top:0.75rem; padding:1rem; border:1px solid var(--border); background:var(--bg-primary); font-family: 'Udemy Sans', 'Noto Sans JP', 'Vazirmatn', 'SF Pro Text', -apple-system, BlinkMacSystemFont, Roboto, 'Segoe UI', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';"></div>
    </div>
  </section>
</div>

<style>
  .doc-item { transition: background 0.12s ease; }
  /* Light-mode hover (default): slightly darker to be visible on light backgrounds */
  .doc-item:hover { background: rgba(0,0,0,0.04); cursor: pointer; }
  .item-actions { display:inline-flex; gap:6px; align-items:center; opacity:0; transform:translateX(6px); transition:opacity .12s ease, transform .12s ease; }
  .doc-item:hover .item-actions { opacity:1; transform:translateX(0); }
  .item-actions button { border-radius:4px; padding:4px; }
  /* Dark-mode override: subtle light hover */
  [data-theme="dark"] .doc-item:hover { background: rgba(255,255,255,0.02); }
  /* Pointer cursor for links in editor */
  #docContent a { cursor: pointer; }
</style>
<script>
async function fetchFiles(){
  const res = await fetch('/learn/docs/files');
  return res.json();
}

function makeItem(d){
  const el = document.createElement('div');
  el.className = 'doc-item';
  el.style.display = 'flex';
  el.style.justifyContent = 'space-between';
  el.style.alignItems = 'center';
  el.style.padding = '0.5rem';
  el.style.borderBottom = '1px solid var(--border)';
  el.dataset.id = d.id;
  const a = document.createElement('a');
  a.href = '#';
  a.textContent = d.name;
  a.style.color = 'var(--text-primary)';
  a.addEventListener('click', (e)=>{
    e.preventDefault();
    attemptLoadFile(d.id, d.name);
  });
  // make draggable for folder moves
  el.setAttribute('draggable','true');
  el.addEventListener('dragstart', (ev)=>{
    ev.dataTransfer.setData('text/plain', d.id);
    ev.dataTransfer.effectAllowed = 'move';
  });
  // allow clicking anywhere on the row (except action buttons) to select the file
  el.addEventListener('click', (e)=>{
    // if click originated inside action buttons, ignore here
    if (e.target.closest && e.target.closest('.item-actions')) return;
    e.preventDefault();
    attemptLoadFile(d.id, d.name);
  });
  // double-click anywhere on the row to rename (except action icons)
  el.addEventListener('dblclick', (e)=>{
    if (e.target.closest && e.target.closest('.item-actions')) return;
    e.stopPropagation();
    e.preventDefault();
    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.value = a.textContent;
    nameInput.style.padding = '0.25rem';
    nameInput.style.width = '160px';
    el.replaceChild(nameInput, a);
    nameInput.focus();
    function finishRename(){
      const newName = (nameInput.value || '').trim() || 'Untitled';
      fetch(`/learn/docs/file/${d.id}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:newName})})
        .then(res=>res.json())
        .then(async (entry)=>{
          // If this file is currently open, update the title input
          const currentOpenId = document.getElementById('saveDocBtn').dataset.current;
          if (currentOpenId === d.id) {
            document.getElementById('docTitle').value = entry.name;
          }
          await loadList();
          // attempt to open the renamed file in UI
          document.querySelectorAll('#foldersList a').forEach(a2=>{ if (a2.textContent === entry.name) a2.click(); });
        });
    }
    nameInput.addEventListener('keydown', (ev)=>{ if (ev.key === 'Enter') finishRename(); });
    nameInput.addEventListener('blur', finishRename);
  });
  el.appendChild(a);
  const actions = document.createElement('div');
  actions.className = 'item-actions';
  // delete icon button
  const del = document.createElement('button');
  del.className = 'btn btn-secondary';
  del.title = 'Delete';
  del.style.display = 'inline-flex';
  del.style.alignItems = 'center';
  del.style.justifyContent = 'center';
  del.style.width = '34px';
  del.style.height = '28px';
  del.style.padding = '0';
  del.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>';
  del.addEventListener('click', async ()=>{
    await fetch(`/learn/docs/file/${d.id}`, {method:'DELETE'});
    const current = document.getElementById('saveDocBtn').dataset.current;
    if (current === d.id) {
      document.getElementById('docTitle').value='';
      const docElClear = document.getElementById('docContent'); if (docElClear) docElClear.innerHTML = '';
      document.getElementById('saveDocBtn').dataset.current = '';
    }
    loadList();
  });
  actions.appendChild(del);
  // rename handled via double-click inline; remove dedicated rename icon
  // start hidden by default; reveal on hover via JS to avoid stylesheet conflicts
  actions.style.opacity = '0';
  actions.style.transform = 'translateX(6px)';
  actions.style.pointerEvents = 'none';
  el.addEventListener('mouseenter', ()=>{
    actions.style.opacity = '1';
    actions.style.transform = 'translateX(0)';
    actions.style.pointerEvents = 'auto';
  });
  el.addEventListener('mouseleave', ()=>{
    actions.style.opacity = '0';
    actions.style.transform = 'translateX(6px)';
    actions.style.pointerEvents = 'none';
  });
  el.appendChild(actions);
  return el;
}

// Folder support: mapping persisted in localStorage under 'docs_folder_mapping' (fileId -> folderName)
function loadFolderMapping(){
  try{ return JSON.parse(localStorage.getItem('docs_folder_mapping')||'{}'); }catch(e){ return {}; }
}
function saveFolderMapping(map){ localStorage.setItem('docs_folder_mapping', JSON.stringify(map)); }
function loadFolderNames(){
  try{ return JSON.parse(localStorage.getItem('docs_folder_names')||'[]'); }catch(e){ return []; }
}
function saveFolderNames(list){ localStorage.setItem('docs_folder_names', JSON.stringify(list)); }

function createFolderElement(folderName){
  const wrap = document.createElement('div');
  wrap.className = 'folder';
  const header = document.createElement('div');
  header.style.display='flex'; header.style.justifyContent='space-between'; header.style.alignItems='center'; header.style.padding='0.25rem 0';
  const left = document.createElement('div'); left.style.display='flex'; left.style.alignItems='center';
  // Use a simple caret span (not a blue button) and make the header pane clickable
  const toggle = document.createElement('span'); toggle.className='folder-caret'; toggle.textContent = '▾'; toggle.style.marginRight='6px'; toggle.style.userSelect='none'; toggle.style.fontSize='12px';
  const title = document.createElement('strong'); title.textContent = folderName; title.style.cursor='pointer';
  left.appendChild(toggle); left.appendChild(title);
  const right = document.createElement('div'); right.style.display='flex'; right.style.gap='6px';
  const newBtn = document.createElement('button'); newBtn.className='btn'; newBtn.textContent='New'; newBtn.title='New file in '+folderName;
  const renameBtn = document.createElement('button'); renameBtn.className='btn btn-secondary'; renameBtn.textContent='✎'; renameBtn.title='Rename folder';
  const delBtn = document.createElement('button'); delBtn.className='btn btn-secondary'; delBtn.title='Delete folder';
  // match file-item delete SVG for consistency
  delBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>';
  right.appendChild(newBtn); right.appendChild(renameBtn); right.appendChild(delBtn);
  header.appendChild(left); header.appendChild(right);
  wrap.appendChild(header);
  const container = document.createElement('div'); container.className='folder-files'; container.style.display='flex'; container.style.flexDirection='column'; container.style.gap='4px'; container.style.padding='0 0 6px 2rem';
  wrap.appendChild(container);

  // toggle by clicking the header pane (ignore clicks on action buttons)
  header.addEventListener('click', (e)=>{
    if (right.contains(e.target)) return; // clicking action buttons should not toggle
    const isHidden = container.style.display === 'none';
    container.style.display = isHidden ? 'flex' : 'none';
    // caret direction: down for open, right for closed
    toggle.textContent = isHidden ? '▾' : '▸';
  });

  // new file in folder
  newBtn.addEventListener('click', async ()=>{
    const res = await fetch('/learn/docs/file', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:'Untitled', content:''})});
    const ent = await res.json();
    // assign to folder
    const mapping = loadFolderMapping(); mapping[ent.id] = folderName; saveFolderMapping(mapping);
    await loadList();
    // open created file
    setTimeout(()=>{ document.querySelectorAll('#foldersList a').forEach(a=>{ if (a.textContent === 'Untitled') a.click(); }); }, 200);
  });

  // rename folder (inline). Guard to avoid double-execution from Enter+blur.
  renameBtn.addEventListener('click', ()=>{
    const input = document.createElement('input'); input.type='text'; input.value = folderName; input.style.padding='4px'; input.style.width='140px';
    header.replaceChild(input, left);
    input.focus();
    let finished = false;
    function finish(){
      if (finished) return; finished = true;
      const newName = (input.value||'').trim() || folderName;
      const names = loadFolderNames();
      const idx = names.indexOf(folderName);
      if (idx !== -1) names[idx] = newName;
      else if (!names.includes(newName)) names.push(newName);
      saveFolderNames(names);
      try{ if (input.parentNode) header.replaceChild(left, input); }catch(e){}
      loadList();
    }
    input.addEventListener('blur', finish);
    input.addEventListener('keydown', (e)=>{ if (e.key==='Enter'){ e.preventDefault(); finish(); } });
  });

  // delete folder (move files to Unsorted)
  delBtn.addEventListener('click', ()=>{
    if (!confirm('Delete folder "'+folderName+'"? Files will move to Unsorted.')) return;
    const mapping = loadFolderMapping();
    Object.keys(mapping).forEach(k=>{ if (mapping[k] === folderName) mapping[k] = 'Unsorted'; });
    saveFolderMapping(mapping);
    const names = loadFolderNames().filter(n=>n!==folderName); saveFolderNames(names);
    loadList();
  });

  // dragover/drop to accept file moves
  container.addEventListener('dragover', (ev)=>{ ev.preventDefault(); ev.dataTransfer.dropEffect='move'; });
  container.addEventListener('drop', (ev)=>{
    ev.preventDefault(); const fid = ev.dataTransfer.getData('text/plain'); if (!fid) return;
    const mapping = loadFolderMapping(); mapping[fid] = folderName; saveFolderMapping(mapping); loadList();
  });

  return {wrap, container, title};
}

async function loadList(){
  const foldersEl = document.getElementById('foldersList'); foldersEl.innerHTML = '';
  const files = await fetchFiles();
  const mapping = loadFolderMapping();
  const names = loadFolderNames();
  // ensure Unsorted always present
  if (!names.includes('Unsorted')) names.unshift('Unsorted');
  // build map folder->files
  const map = {};
  names.forEach(n=> map[n]=[]);
  files.forEach(f=>{
    const folder = mapping[f.id] || 'Unsorted'; if (!map[folder]) map[folder]=[]; map[folder].push(f);
  });
  // render folders in order
  names.forEach(fn=>{
    const {wrap, container, title} = createFolderElement(fn);
    foldersEl.appendChild(wrap);
    const list = map[fn]||[];
    list.forEach(file=>{
      const item = makeItem(file);
      container.appendChild(item);
    });
  });
  // store folder names in case new ones added
  saveFolderNames(names);
}

// create folder button handler
document.getElementById('createFolderBtn').addEventListener('click', ()=>{
  const nameEl = document.getElementById('newFolderName');
  const name = (nameEl.value||'').trim() || 'New Folder';
  const names = loadFolderNames(); if (!names.includes(name)) names.push(name); saveFolderNames(names); nameEl.value=''; loadList();
});

document.getElementById('saveDocBtn').addEventListener('click', async ()=>{
  const id = document.getElementById('saveDocBtn').dataset.current;
  const name = document.getElementById('docTitle').value || 'Untitled';
  const content = (document.getElementById('docContent') && document.getElementById('docContent').innerHTML) || '';
  if (!id){
    const res = await fetch('/learn/docs/file', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:name, content:content})});
    const newEntry = await res.json();
    await loadList();
    // select new
    document.getElementById('saveDocBtn').dataset.current = newEntry.id;
    return;
  }
  await fetch(`/learn/docs/file/${id}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:name, content:content})});
  await loadList();
});

// link UI removed per user request

// delete and rename are handled via left-panel controls; editor buttons removed

loadList();

// Preview: render URLs as clickable links
document.getElementById('previewBtn').addEventListener('click', ()=>{
  const preview = document.getElementById('previewArea');
  const docEl = document.getElementById('docContent');
  const content = docEl ? docEl.innerHTML : '';
  if (preview.style.display === 'none' || preview.style.display === ''){
    preview.innerHTML = sanitizePreviewHtml(content);
    preview.style.display = 'block';
    if (docEl) docEl.style.display = 'none';
    document.getElementById('previewBtn').textContent = 'Edit';
  } else {
    preview.style.display = 'none';
    if (docEl) docEl.style.display = '';
    document.getElementById('previewBtn').textContent = 'Preview';
  }
});

// Auto-resize helper: expands textarea height to fit content on input/paste/load
function autoResize(el){
  if (!el) return;
  el.style.height = 'auto';
  let desired = el.scrollHeight;
  const rect = el.getBoundingClientRect();
  const maxAvailable = window.innerHeight - rect.top - 40; // keep some bottom padding
  if (maxAvailable > 120) desired = Math.min(desired, maxAvailable);
  el.style.height = desired + 'px';
}

const docEl = document.getElementById('docContent');
if (docEl){
  docEl.addEventListener('input', ()=> autoResize(docEl));
  // Preserve formatting on paste but normalize font sizes to 11px
  docEl.addEventListener('paste', (e)=> {
    e.preventDefault();
    const html = (e.clipboardData || window.clipboardData).getData('text/html');
    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0){
      const range = sel.getRangeAt(0);
      range.deleteContents();
      
      if (html) {
        // Create temp container to parse and normalize pasted HTML
        const temp = document.createElement('div');
        temp.innerHTML = html;
        
        // Aggressively remove problematic inline styles but keep bold/italic/color/links
        temp.querySelectorAll('*').forEach(el => {
          // Force font-size to 14px and remove font-family
          el.style.fontSize = '14px';
          el.style.fontFamily = '';
          // Remove layout-breaking styles
          el.style.position = '';
          el.style.display = '';
          el.style.float = '';
          el.style.margin = '';
          el.style.padding = '';
          if (!el.tagName.match(/^(IMG|VIDEO|TABLE)$/i)) {
            el.style.width = '';
            el.style.height = '';
            el.style.minWidth = '';
            el.style.minHeight = '';
            el.style.maxWidth = '';
            el.style.maxHeight = '';
          }
          // Remove line-height and letter-spacing that can break layout
          el.style.lineHeight = '';
          el.style.letterSpacing = '';
          el.style.textIndent = '';
        });
        
        // Insert normalized content
        const frag = document.createDocumentFragment();
        while (temp.firstChild) {
          frag.appendChild(temp.firstChild);
        }
        range.insertNode(frag);
      } else {
        // Fallback to plain text if no HTML
        const text = (e.clipboardData || window.clipboardData).getData('text/plain');
        const textNode = document.createTextNode(text);
        range.insertNode(textNode);
        range.setStartAfter(textNode);
      }
      
      range.collapse(false);
      sel.removeAllRanges();
      sel.addRange(range);
    }
    setTimeout(()=> {
      autoResize(docEl);
      // Force focus back to ensure editor is active
      docEl.focus();
    }, 100);
  });
  window.addEventListener('resize', ()=> autoResize(docEl));
  // ensure initial size matches any existing content
  autoResize(docEl);
  
  // Ctrl+click on links to open in new tab
  docEl.addEventListener('click', (e)=> {
    if ((e.ctrlKey || e.metaKey) && e.target.tagName === 'A') {
      e.preventDefault();
      const url = e.target.href;
      if (url) window.open(url, '_blank', 'noopener,noreferrer');
    }
  });
}

// Selection preservation helpers: save selection before opening popovers and restore before applying
let _savedRange = null;
function saveSelection(){
  const sel = window.getSelection();
  if (sel && sel.rangeCount > 0){
    _savedRange = sel.getRangeAt(0).cloneRange();
  }
}
function restoreSelection(){
  const sel = window.getSelection();
  sel.removeAllRanges();
  if (_savedRange){
    sel.addRange(_savedRange);
    _savedRange = null;
    return true;
  }
  return false;
}

// --- Editor toolbar functionality (WYSIWYG using execCommand) ---
function applyCommand(cmd, value=null){
  document.execCommand(cmd, false, value);
  if (docEl) { autoResize(docEl); docEl.focus(); }
}

// wrap current selection with a span that has the provided inline style
function wrapSelectionWithSpan(style){
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  // if collapsed caret, insert an empty span and place caret inside
  if (range.collapsed){
    const span = document.createElement('span');
    span.setAttribute('style', style);
    span.innerHTML = '\u00A0';
    range.insertNode(span);
    // place caret after the inserted space
    sel.removeAllRanges();
    const r2 = document.createRange();
    r2.setStartAfter(span);
    r2.collapse(true);
    sel.addRange(r2);
    if (docEl) autoResize(docEl);
    return;
  }
  const content = range.extractContents();
  const span = document.createElement('span');
  span.setAttribute('style', style);
  span.appendChild(content);
  range.insertNode(span);
  // reselect inserted node
  sel.removeAllRanges();
  const r3 = document.createRange();
  r3.selectNodeContents(span);
  sel.addRange(r3);
  if (docEl) autoResize(docEl);
}

document.getElementById('fmtFontSize').addEventListener('change', (e)=>{
  const sz = e.target.value;
  if (!sz) return;
  
  const sel = window.getSelection();
  if (sel && sel.rangeCount > 0) {
    const range = sel.getRangeAt(0);
    if (!range.collapsed) {
      // Extract selection content
      const content = range.extractContents();
      
      // Strip all existing font-size styles
      const temp = document.createElement('div');
      temp.appendChild(content);
      temp.querySelectorAll('*').forEach(el => {
        el.style.fontSize = '';
        // Also remove font tags that might interfere
        if (el.tagName === 'FONT') {
          const span = document.createElement('span');
          while (el.firstChild) span.appendChild(el.firstChild);
          el.parentNode.replaceChild(span, el);
        }
      });
      
      // Wrap in new span with target font-size
      const wrapper = document.createElement('span');
      wrapper.style.fontSize = sz + 'px';
      while (temp.firstChild) wrapper.appendChild(temp.firstChild);
      
      // Insert wrapped content
      range.insertNode(wrapper);
      
      // Reselect for visual feedback
      sel.removeAllRanges();
      const newRange = document.createRange();
      newRange.selectNodeContents(wrapper);
      sel.addRange(newRange);
      
      if (docEl) autoResize(docEl);
    }
  }
  
  // Keep dropdown showing selected size
  e.target.value = sz;
  if (docEl) docEl.focus();
});

function showLinkPopover(){

  const toolbar = document.getElementById('editorToolbar');
  const existing = document.getElementById('linkPopover'); if (existing) existing.remove();

      if (linkEl.tagName === 'A') {
        existingUrl = linkEl.href || '';
        break;

      linkEl = linkEl.parentElement;

function sanitizePreviewHtml(html){
  if (!html) return '';
  let s = html.replace(/<script[\s\S]*?>[\s\S]*?<\/script>/gi, '');
  s = s.replace(/\son\w+\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+)/gi, '');
  s = s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const allowed = ['a','span','strong','em','b','i','p','br','div','ul','ol','li','h1','h2','h3','h4','h5','h6'];
  allowed.forEach(tag=>{
    const reOpen = new RegExp('&lt;('+tag+'\\b[^&gt;]*)&gt;','gi');
    s = s.replace(reOpen,'<$1>');
    const reClose = new RegExp('&lt;\\/'+tag+'&gt;','gi');
    s = s.replace(reClose,'</'+tag+'>');
  });
  s = s.replace(/<a\s+([^>]*?)href=(['"])([^'">]+)\2([^>]*)>/gi, '<a $1href="$3" target="_blank" rel="noopener noreferrer"$4>');
  return s;
}

// unsaved-change tracking and navigation guard
let currentSnapshot = '';
let dirty = false;
let currentDocId = '';

function setCurrentSnapshot(){
  const el = document.getElementById('docContent');
  currentSnapshot = el ? el.innerHTML : '';
  dirty = false;
}

function markDirty(){ dirty = true; }

// beforeunload native prompt as fallback
window.addEventListener('beforeunload', (e)=>{
  if (dirty){ e.preventDefault(); e.returnValue = ''; }
});

// helper confirmation modal for unsaved changes
function showUnsavedModal(onSave, onDiscard, onCancel){
  const existing = document.getElementById('unsavedModal'); if (existing) existing.remove();
  const modal = document.createElement('div'); modal.id='unsavedModal';
  modal.style.position='fixed'; modal.style.left='0'; modal.style.top='0'; modal.style.right='0'; modal.style.bottom='0'; modal.style.display='flex'; modal.style.alignItems='center'; modal.style.justifyContent='center'; modal.style.background='rgba(0,0,0,0.3)'; modal.style.zIndex='200';
  const card = document.createElement('div'); card.style.background='var(--bg-primary)'; card.style.border='1px solid var(--border)'; card.style.padding='16px'; card.style.borderRadius='6px'; card.style.minWidth='320px';
  const p = document.createElement('div'); p.textContent = 'You have unsaved changes. Save before leaving?'; p.style.marginBottom='12px';
  const btnRow = document.createElement('div'); btnRow.style.display='flex'; btnRow.style.gap='8px'; btnRow.style.justifyContent='flex-end';
  const saveBtn = document.createElement('button'); saveBtn.className='btn'; saveBtn.textContent='Save';
  const discardBtn = document.createElement('button'); discardBtn.className='btn btn-secondary'; discardBtn.textContent='Discard';
  const cancelBtn = document.createElement('button'); cancelBtn.className='btn btn-secondary'; cancelBtn.textContent='Cancel';
  btnRow.appendChild(cancelBtn); btnRow.appendChild(discardBtn); btnRow.appendChild(saveBtn);
  card.appendChild(p); card.appendChild(btnRow); modal.appendChild(card); document.body.appendChild(modal);
  saveBtn.addEventListener('click', ()=>{ modal.remove(); onSave && onSave(); });
  discardBtn.addEventListener('click', ()=>{ modal.remove(); onDiscard && onDiscard(); });
  cancelBtn.addEventListener('click', ()=>{ modal.remove(); onCancel && onCancel(); });
}

// attempt to navigate to a document id, with unsaved-change handling
async function attemptLoadFile(id, name){
  if (dirty && id !== currentDocId){
    showUnsavedModal(async ()=>{ // save then load
      await document.getElementById('saveDocBtn').click();
      currentDocId = id;
      loadFileById(id);
    }, ()=>{ // discard and load
      dirty = false;
      currentDocId = id;
      loadFileById(id);
    }, ()=>{ /* cancel - do nothing */ });
    return;
  }
  currentDocId = id;
  await loadFileById(id);
}

// load helper used by attemptLoadFile
async function loadFileById(id){
  const res = await fetch(`/learn/docs/file/${id}`);
  const data = await res.json();
  // Temporarily disconnect observer to prevent false dirty flags during load
  if (window.docContentObserver) window.docContentObserver.disconnect();
  document.getElementById('docTitle').value = data.name || '';
  const docEl = document.getElementById('docContent'); if (docEl) docEl.innerHTML = data.content || '';
  setCurrentSnapshot();
  document.getElementById('saveDocBtn').dataset.current = id;
  // Reconnect observer after load completes
  setTimeout(()=>{
    if (window.docContentObserver && docEl){
      window.docContentObserver.observe(docEl, {subtree:true, characterData:true, childList:true});
    }
  }, 100);
}

// wire clicks on left-panel anchors to attemptLoadFile instead of direct load
document.addEventListener('click', (ev)=>{
  const a = ev.target.closest && ev.target.closest('#foldersList a');
  if (a){
    ev.preventDefault();
    // find file id by walking up
    const parent = a.closest('.doc-item');
    if (parent && parent.dataset && parent.dataset.id){
      attemptLoadFile(parent.dataset.id, a.textContent);
    }
  }
});

// ensure content edits set dirty
window.docContentObserver = new MutationObserver(()=>{ markDirty(); });
const docElRef = document.getElementById('docContent');
if (docElRef) window.docContentObserver.observe(docElRef, {subtree:true, characterData:true, childList:true});

// Preview button (uses sanitizer)
document.getElementById('previewBtn').addEventListener('click', ()=>{
  const preview = document.getElementById('previewArea');
  const docEl = document.getElementById('docContent');
  const content = docEl ? docEl.innerHTML : '';
  if (preview.style.display === 'none' || preview.style.display === ''){
    preview.innerHTML = sanitizePreviewHtml(content);
    preview.style.display = 'block';
    if (docEl) docEl.style.display = 'none';
    document.getElementById('previewBtn').textContent = 'Edit';
  } else {
    preview.style.display = 'none';
    if (docEl) docEl.style.display = '';
    document.getElementById('previewBtn').textContent = 'Preview';
  }
});

// Guard navigation links in menu if there are unsaved changes
document.addEventListener('click', (ev)=>{
  const navLink = ev.target.closest && ev.target.closest('.nav-links a');
  if (navLink && dirty){
    ev.preventDefault();
    showUnsavedModal(async ()=>{ // save then navigate
      await document.getElementById('saveDocBtn').click();
      dirty = false;
      window.location.href = navLink.href;
    }, ()=>{ // discard and navigate
      dirty = false;
      window.location.href = navLink.href;
    }, ()=>{ /* cancel - stay on page */ });
  }
}, true);
