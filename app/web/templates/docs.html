{% extends "base.html" %}
{% block content %}
<div style="display:flex; gap:1.5rem;">
  <aside style="width: 380px;">
    <div class="card">
      <div style="display:flex; gap:0.5rem; align-items:center; margin-bottom:0.75rem;">
        <h3 class="futuristic-title" style="margin:0; font-size:1rem; flex:1">Docs</h3>
        <input id="newDocName" placeholder="New file name" style="padding:0.35rem 0.5rem; border:1px solid var(--border); width:160px;">
        <button id="createDocBtn" class="btn">New</button>
      </div>
      <div id="docsList" style="display:flex; flex-direction:column; gap:0.5rem; max-height:60vh; overflow:auto;"></div>
    </div>
  </aside>

  <section style="flex:1;">
    <div class="card" style="position:relative;">
      <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:1rem;">
        <h3 style="margin-top:0; margin-bottom:0.5rem; flex:1">Editor</h3>
        <div style="display:flex; gap:0.5rem;">
          <button id="deleteDocBtn" class="btn btn-secondary">Delete</button>
          <button id="renameDocBtn" class="btn btn-secondary">Rename</button>
          <button id="saveDocBtn" class="btn">Save</button>
        </div>
      </div>
      <input id="docTitle" placeholder="Document title" style="width:100%; padding:0.5rem; margin:0.5rem 0 0.75rem 0; border:1px solid var(--border);">
      <textarea id="docContent" style="width:100%; height:60vh; padding:1rem; border:1px solid var(--border); font-family:JetBrains Mono, monospace;"></textarea>
    </div>
  </section>
</div>

<script>
async function fetchFiles(){
  const res = await fetch('/learn/docs/files');
  return res.json();
}

function makeItem(d){
  const el = document.createElement('div');
  el.style.display = 'flex';
  el.style.justifyContent = 'space-between';
  el.style.alignItems = 'center';
  el.style.padding = '0.5rem';
  el.style.borderBottom = '1px solid var(--border)';
  el.dataset.id = d.id;
  const a = document.createElement('a');
  a.href = '#';
  a.textContent = d.name;
  a.style.color = 'var(--text-primary)';
  a.addEventListener('click', async (e)=>{
    e.preventDefault();
    const res = await fetch(`/learn/docs/file/${d.id}`);
    const data = await res.json();
    document.getElementById('docTitle').value = d.name;
    document.getElementById('docContent').value = data.content;
    document.getElementById('saveDocBtn').dataset.current = d.id;
    document.getElementById('deleteDocBtn').dataset.current = d.id;
    document.getElementById('renameDocBtn').dataset.current = d.id;
  });
  el.appendChild(a);
  const actions = document.createElement('div');
  // small inline delete button for list items
  const del = document.createElement('button');
  del.className = 'btn btn-secondary';
  del.textContent = 'Del';
  del.addEventListener('click', async ()=>{
    await fetch(`/learn/docs/file/${d.id}`, {method:'DELETE'});
    // if deleting currently open doc, clear editor
    const current = document.getElementById('saveDocBtn').dataset.current;
    if (current === d.id) {
      document.getElementById('docTitle').value='';
      document.getElementById('docContent').value='';
      document.getElementById('saveDocBtn').dataset.current = '';
    }
    loadList();
  });
  actions.appendChild(del);
  // inline rename button for list items
  const ren = document.createElement('button');
  ren.className = 'btn btn-secondary';
  ren.textContent = 'Ren';
  ren.style.marginLeft = '0.25rem';
  ren.addEventListener('click', ()=>{
    // replace link with inline input
    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.value = a.textContent;
    nameInput.style.padding = '0.25rem';
    nameInput.style.width = '160px';
    el.replaceChild(nameInput, a);
    nameInput.focus();
    function finishRename(){
      const newName = (nameInput.value || '').trim() || 'Untitled';
      fetch(`/learn/docs/file/${d.id}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:newName})})
        .then(res=>res.json())
        .then(async (entry)=>{
          await loadList();
          // select renamed file
          const anchors = document.querySelectorAll('#docsList a');
          anchors.forEach(a2=>{ if (a2.textContent === entry.name) a2.click(); });
        });
    }
    nameInput.addEventListener('keydown', (e)=>{ if (e.key === 'Enter') finishRename(); });
    nameInput.addEventListener('blur', finishRename);
  });
  actions.appendChild(ren);
  el.appendChild(actions);
  return el;
}

async function loadList(){
  const list = document.getElementById('docsList');
  list.innerHTML = '';
  const files = await fetchFiles();
  files.forEach(f=> list.appendChild(makeItem(f)));
}

document.getElementById('createDocBtn').addEventListener('click', async ()=>{
  const nameEl = document.getElementById('newDocName');
  const name = (nameEl.value || '').trim() || 'Untitled';
  // create new doc in left panel
  const res = await fetch('/learn/docs/file', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:name, content:''})});
  const data = await res.json();
  nameEl.value = '';
  await loadList();
  // auto-select the created doc
  document.querySelectorAll('#docsList a').forEach(a=>{ if (a.textContent === name) a.click(); });
});

document.getElementById('saveDocBtn').addEventListener('click', async ()=>{
  const id = document.getElementById('saveDocBtn').dataset.current;
  const name = document.getElementById('docTitle').value || 'Untitled';
  const content = document.getElementById('docContent').value || '';
  if (!id){
    const res = await fetch('/learn/docs/file', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:name, content:content})});
    const newEntry = await res.json();
    await loadList();
    // select new
    document.getElementById('saveDocBtn').dataset.current = newEntry.id;
    return;
  }
  await fetch(`/learn/docs/file/${id}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:name, content:content})});
  await loadList();
});

document.getElementById('renameDocBtn').addEventListener('click', async ()=>{
  const id = document.getElementById('renameDocBtn').dataset.current;
  if (!id) return;
  const name = document.getElementById('docTitle').value || 'Untitled';
  await fetch(`/learn/docs/file/${id}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:name})});
  await loadList();
});

document.getElementById('deleteDocBtn').addEventListener('click', async ()=>{
  const id = document.getElementById('deleteDocBtn').dataset.current;
  if (!id) return;
  await fetch(`/learn/docs/file/${id}`, {method:'DELETE'});
  await loadList();
  document.getElementById('docTitle').value='';
  document.getElementById('docContent').value='';
  document.getElementById('saveDocBtn').dataset.current = '';
  document.getElementById('deleteDocBtn').dataset.current = '';
  document.getElementById('renameDocBtn').dataset.current = '';
});

loadList();
</script>

{% endblock %}
